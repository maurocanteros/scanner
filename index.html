<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escáner Profesional Rápido</title>
    <!-- Cargamos la librería oficial -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .tarjeta {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 380px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #2a2a2a;
        }
        h1 { font-size: 1.6rem; color: #4CAF50; margin-bottom: 8px; }
        p { font-size: 0.9rem; color: #aaa; margin-bottom: 30px; }
        
        /* Escondemos el input nativo feo para usar nuestro propio botón de diseño */
        #input-camara { display: none; }
        
        .btn-escanear {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            display: inline-block;
            width: 100%;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            transition: background 0.2s;
        }
        .btn-escanear:active { background-color: #388E3C; }

        #zona-resultado {
            margin-top: 35px;
            padding: 15px;
            background-color: #151515;
            border-radius: 10px;
            border: 1px dashed #333;
        }
        .titulo-res { font-size: 0.8rem; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        #resultado { font-size: 1.2rem; font-weight: bold; color: #4CAF50; word-break: break-all; }
        
        /* Div oculto obligatorio para que la librería procese la imagen de fondo */
        #lector-oculto { display: none; }
    </style>
</head>
<body>

    <div class="tarjeta">
        <h1>Escáner de Códigos</h1>
        <p>Presiona el botón, toma una foto al código de barras y listo.</p>

        <!-- Este label funciona como el botón activador táctil -->
        <label for="input-camara" class="btn-escanear">Tomar Foto / Escanear</label>
        
        <!-- El atributo 'capture' fuerza al celular a abrir la cámara trasera en vez de la galería -->
        <input type="file" id="input-camara" accept="image/*" capture="environment">

        <div id="zona-resultado">
            <div class="titulo-res">Código Detectado</div>
            <div id="resultado">Esperando acción...</div>
        </div>
    </div>

    <div id="lector-oculto"></div>

    <script>
        const inputCamara = document.getElementById('input-camara');
        const resultadoDiv = document.getElementById('resultado');

        // Inicializamos el decodificador de imágenes de la librería
        const html5QrCode = new Html5Qrcode("lector-oculto");

        inputCamara.addEventListener('change', e => {
            if (e.target.files.length === 0) return;
            
            const archivoImagen = e.target.files[0];
            resultadoDiv.innerText = "Procesando imagen...";
            resultadoDiv.style.color = "#FFC107"; // Amarillo de carga

            // Procesar el archivo de imagen tomado por la cámara
            html5QrCode.scanFile(archivoImagen, true)
                .then(textoDecodificado => {
                    // Éxito al escanear
                    resultadoDiv.innerText = textoDecodificado;
                    resultadoDiv.style.color = "#4CAF50"; // Verde
                    if (navigator.vibrate) { navigator.vibrate(100); }
                })
                .catch(err => {
                    // Si no encuentra código en la foto
                    resultadoDiv.innerText = "No se detectó ningún código. Intenta enfocar mejor.";
                    resultadoDiv.style.color = "#f44336"; // Rojo
                    console.log(err);
                });
        });
    </script>
</body>
</html>
