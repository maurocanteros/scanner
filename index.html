<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escáner de Barras Infalible</title>
    <!-- Cargamos la librería oficial -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .tarjeta {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 380px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #2a2a2a;
        }
        h1 { font-size: 1.6rem; color: #4CAF50; margin-bottom: 8px; }
        p { font-size: 0.9rem; color: #aaa; margin-bottom: 30px; }
        
        #input-camara { display: none; }
        
        .btn-escanear {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            display: inline-block;
            width: 100%;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            transition: background 0.2s;
        }
        .btn-escanear:active { background-color: #388E3C; }

        #zona-resultado {
            margin-top: 35px;
            padding: 15px;
            background-color: #151515;
            border-radius: 10px;
            border: 1px dashed #333;
        }
        .titulo-res { font-size: 0.8rem; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        #resultado { font-size: 1.2rem; font-weight: bold; color: #4CAF50; word-break: break-all; }
        
        #lector-oculto { display: none; }
    </style>
</head>
<body>

    <div class="tarjeta">
        <h1>Escáner de Códigos</h1>
        <p>Toma una foto nítida y de cerca al código de barras.</p>

        <label for="input-camara" class="btn-escanear">Tomar Foto / Escanear</label>
        <input type="file" id="input-camara" accept="image/*" capture="environment">

        <div id="zona-resultado">
            <div class="titulo-res">Código Detectado</div>
            <div id="resultado">Esperando acción...</div>
        </div>
    </div>

    <!-- Elemento necesario en el DOM para procesar la imagen -->
    <div id="lector-oculto"></div>

    <script>
        const inputCamara = document.getElementById('input-camara');
        const resultadoDiv = document.getElementById('resultado');

        // IMPORTANTE: Inicializamos especificando de forma estricta todos los formatos de barra conocidos (EAN, UPC, Code 128, etc)
        const html5QrCode = new Html5Qrcode("lector-oculto", {
            formatsToSupport: [ 
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.QR_CODE
            ]
        });

        inputCamara.addEventListener('change', e => {
            if (e.target.files.length === 0) return;
            
            // CORRECCIÓN CLAVE: Extraemos solo el primer archivo ([0]) en lugar de pasar la lista completa
            const archivoImagen = e.target.files[0]; 
            
            resultadoDiv.innerText = "Leyendo barras...";
            resultadoDiv.style.color = "#FFC107"; 

            // Escaneamos el archivo individual
            html5QrCode.scanFile(archivoImagen, false)
                .then(textoDecodificado => {
                    resultadoDiv.innerText = textoDecodificado;
                    resultadoDiv.style.color = "#4CAF50"; 
                    if (navigator.vibrate) { navigator.vibrate(100); }
                })
                .catch(err => {
                    resultadoDiv.innerText = "No se leyó el código. ¡Asegúrate de enfocar bien de cerca!";
                    resultadoDiv.style.color = "#f44336"; 
                    console.log(err);
                });
        });
    </script>
</body>
</html>
